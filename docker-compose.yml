version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bidsight_db
    environment:
      POSTGRES_USER: bidsight
      POSTGRES_PASSWORD: bidsight_dev
      POSTGRES_DB: bidsight
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bidsight_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: